name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: pokemon
          POSTGRES_DB: pokemon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pokemon:pokemon@localhost:5432/pokemon_test
      JWT_SECRET_KEY: ci-only-secret
      SEED_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create and seed a fresh test database
        run: npm run init_tables -- --reset
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            # Surface the failure as an annotation, readable without signing in
            msg=$(grep -v "^#\|^ok \|^    ok\|^  ok" test-output.txt | tail -c 7000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=npm test failed::$msg"
          fi
          exit $status
