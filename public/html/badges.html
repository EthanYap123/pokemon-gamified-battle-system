<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Badges · PokéBattle</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="" />
          <span class="brand-name">PokéBattle</span>
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html" class="active">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="d-none">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register"
          >Register</a
        >
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container">
        <div class="page-header">
          <span class="eyebrow">Kanto League</span>
          <h1>Badges</h1>
          <p>All nine badges in the league. Pick a trainer to see the badges they have earned.</p>
        </div>

        <div class="filter-bar">
          <label for="userFilter">Trainer
            <select id="userFilter">
              <option value="">All Users</option>
            </select>
          </label>
        </div>

        <!-- Badge Cards Container -->
        <div id="badgeContainer" class="row"></div>
      </div>
    </main>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/badges.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
