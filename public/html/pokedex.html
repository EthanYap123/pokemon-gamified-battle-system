<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Pokédex · PokéBattle</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="" />
          <span class="brand-name">PokéBattle</span>
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html" class="active">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="d-none">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register"
          >Register</a
        >
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container">
        <div class="page-header">
          <span class="eyebrow">Kanto region</span>
          <h1>Pokédex</h1>
          <p>Every Pokémon in the region. Catch them to fill in your entries.</p>
        </div>

        <div class="filter-bar">
          <!-- View toggle (hidden by default, shown only if logged in) -->
          <label id="filterContainer" class="d-none" for="filterToggle">View
            <select id="filterToggle">
              <option value="user">My Pokédex</option>
              <option value="global">Global Pokédex</option>
            </select>
          </label>

          <!-- Unified filter options (apply to both views) -->
          <label for="typeFilter">Type
            <select id="typeFilter">
              <option value="">Any</option>
              <option value="fire">Fire</option>
              <option value="water">Water</option>
              <option value="electric">Electric</option>
              <option value="grass">Grass</option>
              <option value="poison">Poison</option>
              <option value="psychic">Psychic</option>
              <option value="fighting">Fighting</option>
              <option value="rock">Rock</option>
              <option value="ground">Ground</option>
              <option value="ice">Ice</option>
              <option value="dragon">Dragon</option>
              <option value="dark">Dark</option>
              <option value="ghost">Ghost</option>
              <option value="bug">Bug</option>
              <option value="normal">Normal</option>
              <option value="fairy">Fairy</option>
              <option value="steel">Steel</option>
              <option value="flying">Flying</option>
            </select>
          </label>

          <label for="rarityFilter">Rarity
            <select id="rarityFilter">
              <option value="">Any</option>
              <option value="common">Common</option>
              <option value="uncommon">Uncommon</option>
              <option value="rare">Rare</option>
              <option value="ultra">Ultra</option>
              <option value="legendary">Legendary</option>
            </select>
          </label>

          <button id="applyFilter">Apply Filter</button>
        </div>

        <div id="dexProgress" class="dex-progress d-none">
          <span id="dexProgressText"></span>
          <div class="progress"><div id="dexProgressBar"></div></div>
        </div>

        <div id="pokemonList" class="row"></div>
      </div>
    </main>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/showAllPokedex.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
