<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Battle · PokéBattle</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="" />
          <span class="brand-name">PokéBattle</span>
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="d-none">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register"
          >Register</a
        >
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container">
        <!-- Battle UI -->
        <div class="battle-container">
          <div class="arena" id="arena">
            <img id="leaderSprite" class="leader-sprite d-none" alt="" />

            <!-- Opponent -->
            <div class="battle-card" id="opponentCard">
              <div class="info-box">
                <h3><span><span id="opponentPokemonName">—</span> <small class="lv" id="opponentLevel"></small></span><span class="leader-label" id="opponentName">Gym Leader</span></h3>
                <div class="team-dots" id="opponentDots"></div>
                <div class="hp-row">HP<div class="hp-bar"><div class="hp-fill" id="opponentHp"></div></div></div>
              </div>
            </div>
            <img id="opponentSprite" class="battle-sprite" src="" alt="Opponent" />

            <!-- User -->
            <img id="userSprite" class="battle-sprite" src="" alt="Your Pokémon" />
            <div class="battle-card" id="userCard">
              <div class="info-box">
                <h3><span><span id="userPokemonName">—</span> <small class="lv" id="userLevel"></small></span><span class="leader-label">You</span></h3>
                <div class="team-dots" id="userDots"></div>
                <div class="hp-row">HP<div class="hp-bar"><div class="hp-fill" id="userHp"></div></div></div>
                <div class="hp-text" id="userHpText"></div>
              </div>
            </div>

            <!-- Attack effects and floating messages -->
            <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

            <div class="battle-loading" id="battleLoading">
              <div><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="" />Starting battle...</div>
            </div>
          </div>

          <div class="battle-console">
            <!-- Battle log -->
            <div class="battle-log" id="battleLog" aria-live="polite"></div>

            <!-- Controls -->
            <div class="battle-actions">
              <div class="action-tabs" role="tablist">
                <button id="tabFight" class="active" role="tab" aria-selected="true">Fight</button>
                <button id="tabParty" role="tab" aria-selected="false">Pokémon</button>
              </div>
              <span class="label" id="actionLabel">Choose a move</span>
              <div class="moves" id="moveButtons">
                <!-- Move buttons injected dynamically -->
              </div>
              <div class="party-list d-none" id="partyList">
                <!-- Switch buttons injected dynamically -->
              </div>
              <button id="surrenderBtn">Surrender</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Popup for battle results -->
    <div id="battlePopup" class="popup">
      <div class="popup-content">
        <img id="popupIcon" class="result-icon" alt="" />
        <h2 id="popupResult"></h2>
        <div id="popupRewards"></div>
        <button id="popupCloseBtn">Back to Gyms</button>
      </div>
    </div>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/idToNameMap.browser.js"></script>
    <script src="../js/battle.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
