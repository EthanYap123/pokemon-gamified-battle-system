<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Team</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="Logo" />
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html" class="active">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="d-none">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register"
          >Register</a
        >
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container">
        <h1 class="text-center">Team</h1>

        <!-- Team Slots -->
        <div id="teamGrid" class="team-grid">
          <!-- JS will render 6 slots here -->
        </div>

        <!-- Owned Pokémon -->
        <h2>Your Pokémon</h2>
        <div id="ownedList" class="owned-list">
          <!-- JS will render owned Pokémon cards here -->
        </div>
      </div>
    </main>

    <!-- Starter Modal -->
    <div id="starterModal" class="modal">
      <div class="modal-content">
        <h2>Choose Your Starter</h2>
        <button data-starter="bulbasaur">Bulbasaur</button>
        <button data-starter="charmander">Charmander</button>
        <button data-starter="squirtle">Squirtle</button>
      </div>
    </div>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/idToNameMap.browser.js"></script>
    <script src="../js/team.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
