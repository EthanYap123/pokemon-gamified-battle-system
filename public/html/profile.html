<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Profile · PokéBattle</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="" />
          <span class="brand-name">PokéBattle</span>
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="active">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register">Register</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container">
        <!-- User Info -->
        <section class="profile-hero">
          <div class="avatar lg" id="profileAvatar">?</div>
          <div>
            <span class="eyebrow">Trainer card</span>
            <h1 id="profileUsername">Loading...</h1>
            <p id="profileEmail"></p>
          </div>
        </section>

        <div class="stat-grid">
          <div class="stat-tile">
            <div class="label">Coins</div>
            <div class="value" id="profileCoins">–</div>
          </div>
          <div class="stat-tile">
            <div class="label">Amulet Coins<i class="info-dot" id="amuletInfo" tabindex="0">i</i></div>
            <div class="value" id="profileAmuletCoins">–</div>
            <div class="text-muted small" id="profileAmuletBoost"></div>
          </div>
          <div class="stat-tile">
            <div class="label">Badges</div>
            <div class="value" id="profileBadgeCount">–</div>
          </div>
          <!-- Pokémon Summary -->
          <div class="stat-tile">
            <div class="label">Pokémon owned</div>
            <div class="value" id="pokemonOwned">–</div>
            <div class="progress"><div id="pokemonCompletionBar"></div></div>
            <div class="text-muted small" style="margin-top: 4px"><span id="pokemonCompletion"></span> complete</div>
          </div>
        </div>

        <!-- Team -->
        <section class="section">
          <div class="section-title"><h2>Your Team</h2><a href="team.html">Edit team →</a></div>
          <!-- This container is where profile.js will render the team -->
          <div id="profileTeam" class="team-grid"></div>
        </section>

        <!-- Badges -->
        <section class="section">
          <div class="section-title"><h2>Your Badges</h2><a href="gym.html">Gyms →</a></div>
          <div id="profileBadges" class="row"></div>
        </section>
      </div>
    </main>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/idToNameMap.browser.js"></script>
    <script src="../js/profile.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
