<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/color.css" rel="stylesheet" />
    <title>Profile</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="index.html">
          <img id="logo" class="logo" alt="Logo" />
        </a>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
        <a href="pokedex.html">Pokedex</a>
        <a href="pokemon.html">Pokemon</a>
        <a href="team.html">Team</a>
        <a href="gym.html">Gyms</a>
        <a href="badges.html">Badges</a>
        <a href="shop.html">Shop</a>
      </div>
      <div class="navbar-right">
        <a id="profileButton" href="profile.html" class="active">Profile</a>
        <a id="logoutButton" href="#" class="d-none">Logout</a>
        <a id="loginButton" href="login.html">Login</a>
        <a id="registerButton" href="register.html" class="register">Register</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <div class="container text-center">
        <h1 class="text-center">Profile</h1>

        <!-- User Info -->
        <section style="margin-top: 30px">
          <p><strong>Username:</strong> <span id="profileUsername"></span></p>
          <p><strong>Email:</strong> <span id="profileEmail"></span></p>
          <p><strong>Coins:</strong> <span id="profileCoins"></span></p>
          <p><strong>Amulet Coins:</strong> <span id="profileAmuletCoins"></span></p>
        </section>

        <!-- Badges -->
        <section style="margin-top: 40px">
          <h2>Your Badges</h2>
          <div id="profileBadges" class="row"></div>
        </section>

        <!-- Team -->
        <section style="margin-top: 40px">
          <h2>Your Team</h2>
          <!-- This container is where profile.js will render the team -->
          <div id="profileTeam" class="team-grid"></div>
        </section>

        <!-- Pokémon Summary -->
        <section style="margin-top: 40px">
          <h2>Pokémon Summary</h2>
          <p><strong>Owned:</strong> <span id="pokemonOwned"></span></p>
          <p><strong>Completion Rate:</strong> <span id="pokemonCompletion"></span></p>
        </section>
      </div>
    </main>

    <!-- Project JS -->
    <script src="../js/queryCmds.js"></script>
    <script src="../js/getCurrentURL.js"></script>
    <script src="../js/userNavbarToggle.js"></script>
    <script src="../images/itemSprites.js"></script>
    <script src="../images/pokemonSprites.js"></script>
    <script src="../js/idToNameMap.browser.js"></script>
    <script src="../js/profile.js"></script>

    <!-- Inject logo using sprite function -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logo = document.getElementById("logo");
        if (logo && typeof getBallSprite === "function") {
          logo.src = getBallSprite("premier");
        }
      });
    </script>
  </body>
</html>
